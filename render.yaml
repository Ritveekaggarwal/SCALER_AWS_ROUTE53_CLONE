services:
  - type: web
    name: route53-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ALLOW_SIGNUP
        value: "true"
      - key: HEALTH_CHECKER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
